x-env: &env
  # required
  ANKER_EMAIL: &ANKER_EMAIL ${ANKER_EMAIL}
  ANKER_PASSWORD: &ANKER_PASSWORD ${ANKER_PASSWORD}
  # Priority order for sequential charging, highest priority first (comma-separated serials).
  ANKER_PRIORITY_SNS: &ANKER_PRIORITY_SNS ${ANKER_PRIORITY_SNS}
  TUYA_DEVICE_1_ID: &TUYA_DEVICE_1_ID ${TUYA_DEVICE_1_ID}
  TUYA_DEVICE_1_KEY: &TUYA_DEVICE_1_KEY ${TUYA_DEVICE_1_KEY}
  TUYA_DEVICE_1_IP: &TUYA_DEVICE_1_IP ${TUYA_DEVICE_1_IP}
  TUYA_DEVICE_2_ID: &TUYA_DEVICE_2_ID ${TUYA_DEVICE_2_ID}
  TUYA_DEVICE_2_KEY: &TUYA_DEVICE_2_KEY ${TUYA_DEVICE_2_KEY}
  TUYA_DEVICE_2_IP: &TUYA_DEVICE_2_IP ${TUYA_DEVICE_2_IP}

  # optional
  ANKER_COUNTRY: &ANKER_COUNTRY ${ANKER_COUNTRY:-JP}
  POLL_INTERVAL_MS: &POLL_INTERVAL_MS ${POLL_INTERVAL_MS:-15000}
  MIN_SOLAR_TO_CHARGE_WATTS: &MIN_SOLAR_TO_CHARGE_WATTS ${MIN_SOLAR_TO_CHARGE_WATTS:-150}
  # Constant floor on house consumption that's always safely drawn regardless
  # of solar (fridge compressor, routers, etc). 0 unless you know better -
  # only raise it to a value the house never dips below.
  HOUSE_STANDBY_WATTS: &HOUSE_STANDBY_WATTS ${HOUSE_STANDBY_WATTS:-0}
  TUYA_DEVICE_1_NAME: &TUYA_DEVICE_1_NAME ${TUYA_DEVICE_1_NAME:-gtb800-1}
  TUYA_DEVICE_2_NAME: &TUYA_DEVICE_2_NAME ${TUYA_DEVICE_2_NAME:-gtb800-2}
  # Unverified guesses - confirm with `docker compose run --rm soltrk npx tsx packages/tuya/src/discover.ts <id> <key> <ip>`.
  TUYA_DEVICE_1_POWER_DP: &TUYA_DEVICE_1_POWER_DP ${TUYA_DEVICE_1_POWER_DP:-19}
  TUYA_DEVICE_1_POWER_SCALE: &TUYA_DEVICE_1_POWER_SCALE ${TUYA_DEVICE_1_POWER_SCALE:-10}
  TUYA_DEVICE_2_POWER_DP: &TUYA_DEVICE_2_POWER_DP ${TUYA_DEVICE_2_POWER_DP:-19}
  TUYA_DEVICE_2_POWER_SCALE: &TUYA_DEVICE_2_POWER_SCALE ${TUYA_DEVICE_2_POWER_SCALE:-10}
  # Physical AC-cutoff smart plug(s) - see README "One-time setup" step 6.
  # Truly optional (unlike the GTB-800 devices above): no TUYA_PLUG_1_ID means
  # no battery is gated, and loadTuyaPlugs() treats that as valid.
  TUYA_PLUG_1_ID: &TUYA_PLUG_1_ID ${TUYA_PLUG_1_ID:-}
  TUYA_PLUG_1_KEY: &TUYA_PLUG_1_KEY ${TUYA_PLUG_1_KEY:-}
  TUYA_PLUG_1_IP: &TUYA_PLUG_1_IP ${TUYA_PLUG_1_IP:-}
  TUYA_PLUG_1_GATES_SN: &TUYA_PLUG_1_GATES_SN ${TUYA_PLUG_1_GATES_SN:-}
  TUYA_PLUG_1_SWITCH_DP: &TUYA_PLUG_1_SWITCH_DP ${TUYA_PLUG_1_SWITCH_DP:-1}
  # Below this SOC, a gated device charges at minimum rate regardless of
  # solar/priority - the AC cutoff must never fully drain a battery powering
  # something that can't lose power (e.g. an actual refrigerator).
  GATED_CRITICAL_SOC_PERCENT: &GATED_CRITICAL_SOC_PERCENT ${GATED_CRITICAL_SOC_PERCENT:-6}
  # Once forced on above, stays on until SOC reaches this higher threshold -
  # the gap avoids flipping the plug on/off every cycle near the critical line.
  GATED_RECOVERY_SOC_PERCENT: &GATED_RECOVERY_SOC_PERCENT ${GATED_RECOVERY_SOC_PERCENT:-20}

  # No "internal" tier here: the Anker cloud API base URL and the state file
  # path are fixed implementation details (a constant endpoint, and a path
  # matching the ./data volume mount) - they're hardcoded directly in
  # packages/cli/src/config.ts / packages/anker/src/httpApi.ts instead of
  # being threaded through as env vars.

services:
  soltrk:
    build: .
    environment:
      <<: *env
    volumes:
      - ./data:/app/data
      - ./packages:/app/packages
    restart: unless-stopped
