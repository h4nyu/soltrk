x-env: &env
  # required
  ANKER_EMAIL: &ANKER_EMAIL ${ANKER_EMAIL}
  ANKER_PASSWORD: &ANKER_PASSWORD ${ANKER_PASSWORD}

  # optional
  ANKER_COUNTRY: &ANKER_COUNTRY ${ANKER_COUNTRY:-JP}
  # Which day a history record is filed under, and therefore where a daily
  # total starts and ends. Stored timestamps stay UTC; only this boundary is
  # local. Getting it wrong is not cosmetic - the container's own clock is UTC,
  # where the boundary lands at 09:00 here and would cut every solar day in
  # half, so each daily file would span two afternoons.
  #
  # It has to be given explicitly: a container has no system timezone to
  # inherit. Bind-mounting the host's /etc/localtime does not work either -
  # Docker resolves the symlink, and Node's ICU can then no longer derive a
  # zone name from the path and falls back to UTC (verified on the Pi). An
  # empty value is worse than none, resolving to Etc/Unknown, so the default
  # below is this deployment's own zone rather than a blank.
  TZ: &TZ ${TZ:-Asia/Tokyo}
  # The GTB-800s push a fresh reading every 90s and nothing can make them do
  # it sooner, so this doesn't control how fresh the solar figure is - only
  # how long a new one waits before being acted on. Halving the loop halves
  # that wait (30s on average, from 45s), which matters on mornings where
  # generation moves several hundred watts in minutes. Costs: two MQTT
  # publishes per device per cycle to AWS IoT rather than one lot, and a
  # history file that grows twice as fast. getStatus is free either way - it
  # reads the MQTT session's cached state, not the network.
  POLL_INTERVAL_MS: &POLL_INTERVAL_MS ${POLL_INTERVAL_MS:-30000}
  # Constant floor on house consumption that's always safely drawn regardless
  # of solar. Set it below what the house really draws: while charging, the
  # grid draw settles at exactly `house - this`, so the gap is the operating
  # bias. Too high and the allocator reserves solar the house won't take and
  # the remainder backfeeds. Measured at 99W here (see README); 70 buys about
  # 29W continuously in exchange for never exporting. chargeLimitMin has to
  # move with this - it is `house - this`.
  HOUSE_STANDBY_WATTS: &HOUSE_STANDBY_WATTS ${HOUSE_STANDBY_WATTS:-70}
  # Below this SOC a gated device stops running off its own battery: its plug
  # closes and it feeds its load from AC in passthrough instead. The AC cutoff
  # must never fully drain a battery powering something that can't lose power
  # (e.g. an actual refrigerator). This doesn't charge it - passthrough holds
  # SOC level - it only stops the drain. Set to the devices' own cutoff, so
  # no capacity is held back above it - backup reserve isn't a goal here.
  #
  # These tuning values live here rather than in .env deliberately: .env is
  # git-ignored, so a value pinned there silently wins over whatever the repo
  # says and nothing catches the drift. .env holds credentials only.
  GATED_DISCHARGE_FLOOR_SOC_PERCENT: &GATED_DISCHARGE_FLOOR_SOC_PERCENT ${GATED_DISCHARGE_FLOOR_SOC_PERCENT:-6}

  # No "internal" tier here: the Anker cloud API base URL and the state file
  # path are fixed implementation details (a constant endpoint, and a path
  # matching the ./data volume mount) - they're hardcoded directly in
  # packages/cli/src/config.ts / packages/anker/src/http-api.ts instead of
  # being threaded through as env vars. Tuya device/plug config (id, key,
  # powerDp/Scale, switchDp, gatesSn) similarly isn't here - it lives in
  # data/tuya.json (git-ignored, see README "One-time setup"), since those
  # values change often enough (adding a plug, re-linking a device) that
  # numbered env vars plus docker-compose's shell-escaping footguns for
  # keys containing `$` were worse than a plain JSON file. Same reasoning
  # for the battery device list: it lives directly in data/devices.json
  # (see README) rather than being seeded from an env var - the file was
  # already the live source of truth, so requiring an env var too, forever,
  # just for a one-time seed was redundant.

# Common config shared by both services below - same pattern as the sibling
# picomanager project's `x-app` anchor.
x-app: &app
  image: soltrk:latest
  build: .
  environment:
    <<: *env
  volumes:
    - ./data:/app/data
    - ./packages:/app/packages
  # Needed for Tuya UDP broadcast discovery (tuyapi's find()) - Docker
  # Desktop's default bridge network doesn't deliver broadcast/multicast
  # packets into the container at all (confirmed live: 0 packets received
  # even listening for any device, same root cause as nmap host-discovery
  # failing earlier in this project). Requires Docker Desktop's host
  # networking support to be enabled (Settings > Resources > Network).
  network_mode: host

services:
  # No `command` - never `up`, only `run --rm` for one-off dev work (tsc,
  # tests, discover.ts, capture-mqtt.ts, ...), e.g.:
  #   docker compose run --rm app npx tsc --noEmit
  #   docker compose run --rm app npm test
  app:
    <<: *app

  # The actual running system - `command` starts the control loop.
  soltrk:
    <<: *app
    command: ["npx", "tsx", "packages/cli/src/index.ts", "run"]
    restart: unless-stopped

  # Rolls completed history files into monthly summaries once a night, in a
  # process of its own. That separation is the point: the rollup reads a day of
  # JSONL and builds a month of accumulators, and doing that inside the control
  # loop would put a nightly memory spike - and any bug in it - inside the
  # process managing household power. Host cron would work too, but then the
  # schedule lives outside the repository and is forgotten the next time the Pi
  # is rebuilt. The sibling picomanager project runs its scheduler as its own
  # service for the same reason, and this uses the same library (node-schedule)
  # so there is one to know across both repos.
  #
  # No `build:` here, for the same reason as `web` below. No network either: it
  # only ever touches ./data.
  scheduler:
    image: soltrk:latest
    environment:
      TZ: *TZ
      SUMMARIZE_CRON: ${SUMMARIZE_CRON:-0 3 * * *}
      SUMMARIZE_RETENTION_DAYS: ${SUMMARIZE_RETENTION_DAYS:-60}
    volumes:
      - ./data:/app/data
      - ./packages:/app/packages
    command: ["npx", "tsx", "packages/cli/src/index.ts", "schedule"]
    restart: unless-stopped

  # Read-only dashboard over the loop's own output (data/state.json and
  # data/history.jsonl). Same image as the services above with a different
  # command - packages/web is already inside it, both COPY'd at build time and
  # bind-mounted at runtime, so it needs no image of its own.
  #
  # The browser bundle in packages/web/dist is built by `make web-build`,
  # which runs vite in a throwaway `app` container - see the Makefile.
  #
  # Written out rather than merging `*app` on purpose: that anchor carries
  # `build: .`, and inheriting it would let `up -d --build web` rebuild the
  # control loop's image behind your back. With no build section here, nothing
  # done to this service can touch it. Run `webbuild` above after a UI change,
  # then `docker compose up -d web` - never `--build`.
  #
  # It also takes none of *env: the dashboard has no business holding the Anker
  # credentials, and ./data is mounted read-only since it only ever reads.
  web:
    image: soltrk:latest
    environment:
      WEB_PORT: ${WEB_PORT:-8080}
      # How much history is held in memory for the charts. The file is
      # append-only and grows about 1MB/day, so this bounds the Pi's RAM use
      # rather than the file itself.
      WEB_RETENTION_DAYS: ${WEB_RETENTION_DAYS:-30}
    volumes:
      - ./data:/app/data:ro
      - ./packages:/app/packages
    command: ["npx", "tsx", "packages/web/src/index.ts"]
    # Same reason as the services above, plus it puts the dashboard on the Pi's
    # LAN address directly: http://192.168.1.34:8080
    network_mode: host
    restart: unless-stopped
