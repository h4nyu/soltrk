<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the page paint under the status bar on a
         notched phone; styles.css pays that back with safe-area padding. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>soltrk</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>☀️</text></svg>" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Tints the browser and status bar to match whichever theme is showing. -->
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)" />
    <!-- iOS reads none of the manifest for "add to home screen"; these three
         are what give it a full-screen window and an icon, and they work over
         plain HTTP, unlike a service worker. -->
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="soltrk" />
  </head>
  <body>
    <header>
      <h1>soltrk</h1>
      <nav id="tabs"></nav>
      <span id="updated"></span>
    </header>
    <section id="tab-now">
      <h2 class="group-label">パネル</h2>
      <section id="panels" class="cards"></section>
      <h2 class="group-label">バッテリー</h2>
      <section id="battery" class="cards"></section>
      <section id="savings" class="cards savings"></section>
    </section>
    <section id="tab-history" hidden>
      <div id="seek" class="seek">
        <div id="seek-chart"></div>
        <div id="seek-window" class="seek-window">
          <div id="seek-handle-left" class="handle left"></div>
          <div id="seek-handle-right" class="handle right"></div>
        </div>
      </div>
      <main id="charts"></main>
      <footer id="meta"></footer>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
